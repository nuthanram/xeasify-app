name: xeasify_app
description: Xeasify B2B Influencer Marketplace — Creator & Merchant Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Path URLs on web (/oauth/youtube?code=… must reach the router, not a #fragment)
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.3.0
  # Opens the Google consent page for web YouTube sign-in
  url_launcher: ^6.3.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Geolocation
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
