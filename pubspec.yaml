name: xeasify_app
description: Xeasify B2B Influencer Marketplace â€” Creator & Merchant Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Path URLs on web (/oauth/youtube?code=â€¦ must reach the router, not a #fragment)
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.3.0
  # Opens the Google consent page for web YouTube sign-in
  url_launcher: ^6.3.1

  # Instagram / Facebook creator sign-in (Meta SDK on Android, Meta JS SDK on web)
  flutter_facebook_auth: ^7.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Geolocation
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  firebase_auth: 5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

# path_provider_foundation 2.6.0 (pulled in transitively by google_fonts -> path_provider)
# moved to a native-assets hook that depends on package:objective_c. Compiling that hook
# fails on Windows whenever the Flutter SDK or project path contains a space (our dev
# machine's path does), breaking `flutter run`/`flutter build` for every target, not just
# macOS/iOS. Pinned to the last version before the native-assets hook was introduced.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
